```yaml
name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER_1 }}
          password: ${{ secrets.DOCKERHUB_USER_1_PWD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check DockerHub username
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USER_1 }}" ]; then
            echo "ERROR: DOCKERHUB_USER_1 is empty or unavailable"
            exit 1
          fi

          echo "DockerHub username is configured"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER_1 }}/hello-cicd:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USER_1 }}/hello-cicd:latest
```

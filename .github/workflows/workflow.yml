name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER_1 }}
          password: ${{ secrets.DOCKERHUB_USER_1_PWD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USER_1 }}/hello-cicd:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USER_1 }}/hello-cicd:latest .

      - name: Push Docker image
        run: docker push --all-tags ${{ secrets.DOCKERHUB_USER_1 }}/hello-cicd


name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER_1 }}
          password: ${{ secrets.DOCKERHUB_USER_1_PWD }}

      - name: Check Docker Hub Username
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USER_1 }}" ]; then
            echo "DOCKERHUB_USER_1 is EMPTY"
            exit 1
          else
            echo "DOCKERHUB_USER_1 is configured"
          fi

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USER_1 }}/hello-cicd:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USER_1 }}/hello-cicd:latest

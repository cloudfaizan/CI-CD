
name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER_1 }}
          password: ${{ secrets.DOCKERHUB_USER_1_PWD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER_1 }}/hello-cicd:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USER_1 }}/hello-cicd:latest
```

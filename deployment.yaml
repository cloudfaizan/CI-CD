apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basic-web
  template:
    metadata:
      labels:
        app: basic-web
    spec:
      containers:
      - name: basic-web
        image: dockerfaizan007/basic-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
